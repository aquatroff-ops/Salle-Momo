<style>

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.chips span { font-size: .85rem; color: var(--muted); font-weight: 600; }
.chip { min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.tbar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.tbar .in { width: 100%; max-width: 34rem; background: var(--accent); color: var(--accent-fg); border-radius: 14px; padding: 6px 8px 8px 14px; display: flex; align-items: center; gap: 8px; position: relative; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.25); }

<body>
<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden><div class="in"><b id="tlabel"></b><button data-a="tplus">+30 s</button><button data-a="tskip">Passer</button><i class="fill" id="tfill"></i></div></div>

</div></nav>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
(function () {
var KEY = 'salle-v1';
var GOAL = 3;

var BASE = [
{ id: 'pec-fly', name: 'Pec fly', g: 'pecs' },
{ id: 'chest-press', name: 'Chest press', g: 'pecs' },
{ id: 'lat-pulldown', name: 'Lat pulldown', g: 'dos' },
{ id: 'rowing', name: 'Rowing assis', g: 'dos' },
{ id: 'div-row', name: 'Diverging seated row', g: 'dos' },
{ id: 'shoulder-press', name: 'Shoulder press', g: 'epaules' },
{ id: 'lateral', name: 'Élévations latérales', g: 'epaules' },
{ id: 'rear-delt', name: 'Oiseau inversé (rear delt)', g: 'epaules' },
{ id: 'face-pull', name: 'Face pull', g: 'epaules' },
{ id: 'arm-curl', name: 'Arm curl', g: 'bras' },
{ id: 'triceps', name: 'Triceps poulie', g: 'bras' },
{ id: 'dip-assist', name: 'Dips assistés', g: 'bras', assist: true },
{ id: 'leg-press', name: 'Presse à cuisses', g: 'jambes' },
{ id: 'leg-ext', name: 'Leg extension', g: 'jambes' },
{ id: 'leg-curl', name: 'Leg curl couché', g: 'jambes' },
{ id: 'hip-add', name: 'Adducteurs', g: 'jambes' },
{ id: 'hip-abd', name: 'Abducteurs', g: 'jambes' },
{ id: 'calf', name: 'Mollets (machine)', g: 'jambes' },
{ id: 'hip-thrust', name: 'Hip thrust', g: 'jambes' },
{ id: 'rdl', name: 'Soulevé de terre roumain', g: 'jambes' },
{ id: 'abdo-incl', name: 'Abdos inclinés', g: 'abdos' },
{ id: 'releve', name: 'Relevés de jambes', g: 'abdos' },
{ id: 'gainage', name: 'Gainage', g: 'abdos', t: 'time' },
{ id: 'velo', name: 'Vélo', g: 'cardio', t: 'time' },
{ id: 'box-jump', name: 'Sauts sur box', g: 'cardio', t: 'reps' }
];
function sets(n, kg, reps) { var a = []; for (var i = 0; i < n; i++) a.push({ kg: kg, reps: reps }); return a; }
function seed() {
var s = {};
s['2026-10-28'] = { note: '', ex: [
{ m: 'velo', sets: sets(1, 0, 300) },
{ m: 'leg-press', sets: sets(4, 66, 12) },
{ m: 'leg-ext', sets: sets(4, 52, 10) },
{ m: 'leg-curl', sets: sets(4, 36, 10) },
{ m: 'hip-add', sets: sets(4, 52, 10) },
{ m: 'hip-abd', sets: sets(4, 52, 10) }
] };
s['2026-10-27'] = { note: '', ex: [
{ m: 'pec-fly', sets: sets(4, 66, 10) },
{ m: 'lat-pulldown', sets: sets(4, 45, 8) },
{ m: 'arm-curl', sets: sets(4, 25, 10) },
{ m: 'shoulder-press', sets: sets(4, 32, 10) },
{ m: 'dip-assist', sets: sets(4, 36, 8) },
{ m: 'abdo-incl', sets: sets(2, 10, 15) },
{ m: 'releve', sets: sets(2, 0, 15) },
{ m: 'gainage', sets: sets(2, 0, 60) }
] };
return { sessions: s, custom: [], plans: {} };
}
var mem = null;
function load() {
try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (o && o.sessions) { o.custom = o.custom || []; o.plans = o.plans || {}; if (o.plan) { var tk = fmt(new Date()); if (!o.plans[tk]) o.plans[tk] = o.plan; delete o.plan; } return o; } } } catch (e) {}
return mem || seed();
}
var state = load();
function save() { mem = state; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function shift(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return fmt(d); }
function weekStart(d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return fmt(x); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; }
function nf(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }
function dur(s) { return s >= 60 && s % 60 === 0 ? (s / 60) + ' min' : s + ' s'; }
var today = fmt(new Date());
var ui = { view: 'seance', date: today, month: today.slice(0, 7), armed: '' };
function allM() { return BASE.concat(state.custom); }
function M(id) { var l = allM(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return { id: id, name: id, g: 'dos' }; }
function dates() { return Object.keys(state.sessions).filter(function (d) { return state.sessions[d].ex.length; }).sort(); }
function describe(m, ss) {
var out = [], prev = '', cnt = 0;
function flush() { if (cnt) out.push(cnt + ' × ' + prev); }
ss.forEach(function (s) {
var t = m.t === 'time' ? dur(s.reps) : (s.reps + ' rép.' + (m.t !== 'reps' && s.kg > 0 ? (m.assist ? ' avec ' + nf(s.kg) + ' kg d’assistance' : ' à ' + nf(s.kg) + ' kg') : ''));

});
flush();

}
function last(mid, before) {
var ds = dates().filter(function (d) { return d < before; }).reverse();
for (var i = 0; i < ds.length; i++) {
var ex = state.sessions[ds[i]].ex;
for (var j = 0; j < ex.length; j++) if (ex[j].m === mid && ex[j].sets.length) return { d: ds[i], sets: ex[j].sets };
}
return null;
}
function score(m, s) {
if (m.t) return s.reps;
if (m.assist) return s.kg > 0 ? (1000 - s.kg) * 1000 + s.reps : -1;
return s.kg * 1000 + s.reps;
}
function recordOf(mid, skipDate) {
var m = M(mid), best = null;
dates().forEach(function (d) {
if (d === skipDate) return;
state.sessions[d].ex.forEach(function (e) {
if (e.m !== mid) return;
e.sets.forEach(function (x) {
var sc = score(m, x);
if (sc < 0) return;
if (!best || sc > best.sc) best = { sc: sc, kg: x.kg, reps: x.reps, d: d };
});
});
});
return best;
}
function recText(m, r) {
if (m.t === 'time') return dur(r.reps);
if (m.t === 'reps') return r.reps + ' rép.';
if (m.assist) return nf(r.kg) + ' kg d’assistance × ' + r.reps;
if (!r.kg) return r.reps + ' rép.';
return nf(r.kg) + ' kg × ' + r.reps;
}
function hintHtml(e) {
var m = M(e.m), lp = last(e.m, ui.date), rec = recordOf(e.m, ui.date);
var h = lp ? 'Dernière fois (' + shortDate(lp.d) + ') : ' + esc(describe(m, lp.sets)) : 'Première fois sur cette machine';
if (rec) {
h += '<br>Record : ' + esc(recText(m, rec)) + ' (' + shortDate(rec.d) + ')';
var cur = -1;
e.sets.forEach(function (x) { var sc = score(m, x); if (sc > cur) cur = sc; });
if (cur > rec.sc) h += ' · <strong class="rec">Nouveau record !</strong>';
}
return h;
}
function summaryText() {
var ds = dates().slice(-12).reverse();
var L = ['Carnet de salle, résumé du ' + today, '', 'SÉANCES (la plus récente en premier)'];
ds.forEach(function (d) {
var s = state.sessions[d];
L.push(cap(parse(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })));
s.ex.forEach(function (e) { var m = M(e.m); L.push('- ' + m.name + ' : ' + describe(m, e.sets)); });
if (s.note && s.note.trim()) L.push('Note : ' + s.note.trim().replace(/\n+/g, ' / '));
L.push('');
});
L.push('RECORDS PAR MACHINE');
allM().forEach(function (m) { var r = recordOf(m.id, ''); if (r) L.push('- ' + m.name + ' : ' + recText(m, r) + ' (' + shortDate(r.d) + ')'); });
return L.join('\n');
}
function shareCard() {
return '<section class="card"><h2 class="ex-name">Envoyer à Claude</h2><p class="hint">Copie le résumé de tes dernières séances, puis colle-le dans la discussion avec Claude.</p><div class="row"><button class="btn primary" data-a="copyc">Copier mes séances</button></div><p class="hint" id="cmsg" role="status"></p><textarea id="cptxt" readonly hidden></textarea></section>';
}
function shortDate(d) { return parse(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
function volume(s) {
var v = 0, n = 0;
s.ex.forEach(function (e) { var m = M(e.m); n += e.sets.length; if (!m.t && !m.assist) e.sets.forEach(function (x) { v += x.kg * x.reps; }); });
return { v: v, n: n };
}
function sumText(s) {
if (!s || !s.ex.length) return '';
var o = volume(s);
return s.ex.length + ' exercices · ' + o.n + ' séries · ' + Math.round(o.v).toLocaleString('fr-FR') + ' kg soulevés';
}
function weekCount(ws) {
var end = shift(ws, 6);
return dates().filter(function (d) { return d >= ws && d <= end; }).length;
}
function streak() {
var ws = weekStart(new Date()), n = 0;
if (weekCount(ws) >= GOAL) n++;
ws = shift(ws, -7);
while (weekCount(ws) >= GOAL) { n++; ws = shift(ws, -7); }
return n;
}
var timer = null, tickId = null, wl = null;

try {
if (on && !wl && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wl = l; l.addEventListener('release', function () { wl = null; }); }, function () {});
if (!on && wl) { wl.release(); wl = null; }
} catch (e) {}
}
function beep() {
try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}

h += '<section class="card" style="margin-top:20px"><h2 class="ex-name">Importer une séance préparée</h2><p class="hint">Colle ici le code envoyé par Claude. Si le code contient des dates, les séances sont programmées dans le calendrier.</p><textarea id="plan-in" placeholder="Colle le code ici"></textarea><div class="row"><button class="btn primary" data-a="planimp">Charger la séance</button></div><p class="hint" id="pmsg" role="status">' + esc(ui.pmsg || '') + '</p></section>';
h += viewProg();
h += shareCard();
h += viewCustom();
h += '<section class="card"><h2 class="ex-name">Sauvegarde</h2><p class="hint">Tes séances sont enregistrées dans ce navigateur. Exporte un fichier de temps en temps, il sert aussi à changer de téléphone.</p><div class="row"><button class="btn" data-a="export">Exporter</button><button class="btn" data-a="import">Importer</button></div><p class="hint" id="dmsg" role="status"></p></section>';
return h;
}
function render() {
var app = document.getElementById('app');
app.innerHTML = ui.view === 'cal' ? viewCal() : ui.view === 'mach' ? viewMach() : ui.view === 'run' ? viewRun() : viewSeance();
wake(ui.view === 'run');
updateTbar();
Array.prototype.forEach.call(document.querySelectorAll('nav.bar button'), function (b) {
if (b.getAttribute('data-v') === (ui.view === 'run' ? 'seance' : ui.view)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
});
}
function ensure() {
if (!state.sessions[ui.date]) state.sessions[ui.date] = { note: '', ex: [] };
return state.sessions[ui.date];
}
function tidy() {
var s = state.sessions[ui.date];
if (s && !s.ex.length && !s.note) delete state.sessions[ui.date];
}
function addEx(id) {
var s = ensure(), m = M(id), l = last(id, ui.date);
var base = l ? l.sets.map(function (x) { return { kg: x.kg, reps: x.reps }; }) : [m.t === 'time' ? { kg: 0, reps: 30 } : { kg: 0, reps: 10 }];
s.ex.push({ m: id, sets: base });
}
document.addEventListener('click', function (ev) {
var t = ev.target.closest('[data-a]');
if (!t) return;
var a = t.getAttribute('data-a'), i = +t.getAttribute('data-i'), j = +t.getAttribute('data-j');
var s = state.sessions[ui.date];
if (a !== 'arm') ui.armed = '';
if (a === 'view') { ui.view = t.getAttribute('data-v'); window.scrollTo(0, 0); }
else if (a === 'day') ui.date = shift(ui.date, +t.getAttribute('data-n'));
else if (a === 'today') ui.date = today;
else if (a === 'mon') { var p = ui.month.split('-').map(Number), d = new Date(p[0], p[1] - 1 + (+t.getAttribute('data-n')), 1); ui.month = fmt(d).slice(0, 7); }
else if (a === 'pick') { ui.date = t.getAttribute('data-d'); ui.view = 'seance'; window.scrollTo(0, 0); }
else if (a === 'addset') { var arr = s.ex[i].sets, l = arr[arr.length - 1] || { kg: 0, reps: 10 }; arr.push({ kg: l.kg, reps: l.reps }); save(); }
else if (a === 'delset') { s.ex[i].sets.splice(j, 1); if (!s.ex[i].sets.length) s.ex.splice(i, 1); tidy(); save(); }
else if (a === 'arm') ui.armed = t.getAttribute('data-k');
else if (a === 'delex') { s.ex.splice(i, 1); tidy(); save(); }
else if (a === 'addex') { addEx(document.getElementById('sel').value); save(); }
else if (a === 'newm') {
var name = document.getElementById('nm-name').value.trim();
if (!name) { document.getElementById('nm-name').focus(); return; }
var m = { id: 'c-' + Date.now(), name: name, g: document.getElementById('nm-g').value };
var mt = document.getElementById('nm-t').value; if (mt === 'time' || mt === 'reps') m.t = mt; if (mt === 'assist') m.assist = true;
state.custom.push(m); addEx(m.id); save();
}
else if (a === 'copylast') {
var ds = dates().filter(function (x) { return x < ui.date; });
var src = state.sessions[ds[ds.length - 1]];
var cur = ensure();
src.ex.forEach(function (e) { cur.ex.push({ m: e.m, sets: e.sets.map(function (x) { return { kg: x.kg, reps: x.reps }; }) }); });
save();
}
else if (a === 'export') {
var msg = '';
try {
var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
var url = URL.createObjectURL(blob), link = document.createElement('a');
link.href = url; link.download = 'carnet-de-salle-' + today + '.json';
document.body.appendChild(link); link.click(); link.remove();
setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
msg = 'Fichier exporté.';
} catch (e) { msg = 'L’export a échoué sur ce navigateur.'; }
document.getElementById('dmsg').textContent = msg;
return;
}
else if (a === 'import') { document.getElementById('imp').click(); return; }
else if (a === 'planimp') {
var res = importPlan(document.getElementById('plan-in').value);
ui.pmsg = res.msg;
if (res.ok && res.dates.length === 1) { ui.view = 'seance'; ui.date = res.dates[0]; ui.pmsg = ''; window.scrollTo(0, 0); }
}
else if (a === 'plandrop') { delete state.plans[ui.date]; save(); }
else if (a === 'planmove') { if (state.plans[ui.date] && !state.plans[today]) { state.plans[today] = state.plans[ui.date]; delete state.plans[ui.date]; ui.date = today; save(); } }
else if (a === 'cmerge') {
var ck = +t.getAttribute('data-k'), csrc = state.custom[ck], cdst = document.getElementById('cm-' + ck).value;
if (!csrc) return;
if (!cdst) { document.getElementById('cmm-' + ck).textContent = 'Choisis d’abord l’exercice dans lequel fusionner.'; return; }
if (t.getAttribute('data-armed') !== '1') { t.setAttribute('data-armed', '1'); t.textContent = 'Confirmer la fusion ?'; return; }
Object.keys(state.sessions).forEach(function (d) { state.sessions[d].ex.forEach(function (e) { if (e.m === csrc.id) e.m = cdst; }); });
Object.keys(state.plans).forEach(function (d) { state.plans[d].ex.forEach(function (e) { if (e.m === csrc.id) e.m = cdst; }); });
state.custom.splice(ck, 1);
ui.cmsg = '« ' + csrc.name + ' » a été fusionné.';
save();
}
else if (a === 'cdel') {
var dk = +t.getAttribute('data-k'), dm = state.custom[dk];
if (!dm) return;
if (t.getAttribute('data-armed') !== '1') { t.setAttribute('data-armed', '1'); t.textContent = 'Confirmer la suppression ?'; return; }
state.custom.splice(dk, 1);
ui.cmsg = '« ' + dm.name + ' » a été supprimé.';
save();
}
else if (a === 'runstart') {
var pl = PL();
if (pl) {
var k0 = 0;
while (k0 < pl.ex.length && pl.ex[k0].sets.every(function (x) { return x.done; })) k0++;
pl.idx = Math.min(k0, pl.ex.length - 1);
ui.view = 'run'; save(); window.scrollTo(0, 0);
}
}
else if (a === 'runcheck') {
var pe = PL().ex[i], ps = pe.sets[j];
ps.done = !ps.done;
if (ps.done) {
var allDone = pe.sets.every(function (x) { return x.done; });
if (!(allDone && PL().idx === PL().ex.length - 1)) startTimer(allDone ? PL().restEx : (pe.rest || PL().rest));
else stopTimer();
}
save();
}
else if (a === 'runaddset') { var ra = PL().ex[PL().idx].sets, rl = ra[ra.length - 1] || { kg: 0, reps: 10 }; ra.push({ kg: rl.kg, reps: rl.reps, done: false }); save(); }
else if (a === 'runprev') { PL().idx = Math.max(0, PL().idx - 1); save(); window.scrollTo(0, 0); }
else if (a === 'runnext') { PL().idx = Math.min(PL().ex.length - 1, PL().idx + 1); save(); window.scrollTo(0, 0); }
else if (a === 'runend') { finishPlan(); window.scrollTo(0, 0); }
else if (a === 'timer') startTimer(+t.getAttribute('data-s'));
else if (a === 'tskip') stopTimer();
else if (a === 'tplus') { if (timer && !timer.fired) { timer.end += 30000; timer.total += 30; } else startTimer(30); updateTbar(); }
else if (a === 'copyc') {
var txt = summaryText(), msgEl = document.getElementById('cmsg'), box = document.getElementById('cptxt');
var fallback = function () { box.hidden = false; box.value = txt; box.rows = 8; box.focus(); box.select(); msgEl.textContent = 'Sélectionne le texte ci-dessous, copie-le, puis colle-le dans la discussion.'; };
try { navigator.clipboard.writeText(txt).then(function () { msgEl.textContent = 'Copié. Colle-le maintenant dans la discussion avec Claude.'; }, fallback); } catch (err) { fallback(); }
return;
}
render();
});
document.addEventListener('input', function (ev) {
var t = ev.target, f = t.getAttribute && t.getAttribute('data-f'), pf = t.getAttribute && t.getAttribute('data-pf');
if (pf && PL()) { PL().ex[+t.getAttribute('data-i')].sets[+t.getAttribute('data-j')][pf] = num(t.value); save(); return; }
var cf = t.getAttribute && t.getAttribute('data-cf');
if (cf) {
var cm = state.custom[+t.getAttribute('data-k')];
if (cm) { if (cf === 'name') { if (t.value.trim()) cm.name = t.value.slice(0, 60); } else if (GROUPS[t.value]) cm.g = t.value; save(); }
return;
}
if (!f) return;
var s = ensure();
if (f === 'note') { s.note = t.value; tidy(); save(); return; }
var x = s.ex[+t.getAttribute('data-i')].sets[+t.getAttribute('data-j')];
x[f] = num(t.value);
save();
var el = document.getElementById('sum');
if (el) el.textContent = sumText(s);
var hi = t.getAttribute('data-i'), hp = document.getElementById('hint' + hi);
if (hp) hp.innerHTML = hintHtml(s.ex[+hi]);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); if (ui.view === 'run') wake(true); } });
document.getElementById('imp').addEventListener('change', function (ev) {
var file = ev.target.files && ev.target.files[0];
if (!file) return;
var r = new FileReader();
r.onload = function () {
var msg;
try {
var o = JSON.parse(r.result);
if (!o || typeof o.sessions !== 'object') throw new Error('format');
Object.keys(o.sessions).forEach(function (d) { if (o.sessions[d] && Array.isArray(o.sessions[d].ex)) state.sessions[d] = o.sessions[d]; });
(o.custom || []).forEach(function (m) { if (m && m.id && !state.custom.some(function (c) { return c.id === m.id; })) state.custom.push(m); });
save(); msg = 'Séances importées.';
} catch (e) { msg = 'Ce fichier n’est pas une sauvegarde valide.'; }
render();
var d = document.getElementById('dmsg'); if (d) d.textContent = msg;
};
r.readAsText(file);
ev.target.value = '';
});
save();
render();
})();
</script>
